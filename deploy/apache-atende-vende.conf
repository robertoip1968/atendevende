<VirtualHost *:80>
    ServerName atendeevende.com.br
    ServerAlias www.atendeevende.com.br

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/

    ProxyRequests Off
    ProxyTimeout 60

    <Proxy *>
        Require all granted
    </Proxy>

    <Location />
        Require all granted
    </Location>

    # Cache longo para os assets estáticos gerados pelo build
    <Location "/assets/">
        ProxyPass "http://127.0.0.1:3000/assets/"
        ProxyPassReverse "http://127.0.0.1:3000/assets/"
        Header set Cache-Control "public, immutable"
        Header set Expires "Thu, 31 Dec 2099 20:00:00 GMT"
    </Location>
</VirtualHost>
